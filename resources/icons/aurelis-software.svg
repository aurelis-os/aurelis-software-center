<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" version="1.1" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#5294e2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2b74d6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradient2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#68b8e8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5294e2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background rounded rectangle -->
  <rect x="8" y="8" width="112" height="112" rx="16" ry="16" style="fill:url(#gradient1);stroke:#1a4d8f;stroke-width:2"/>
  
  <!-- Shopping bag shape -->
  <g transform="translate(0, 4)">
    <!-- Bag body -->
    <path d="M 32 44 L 28 100 Q 28 108 36 108 L 92 108 Q 100 108 100 100 L 96 44 Z" 
          style="fill:url(#gradient2);stroke:#ffffff;stroke-width:2.5;stroke-linejoin:round"/>
    
    <!-- Handle left -->
    <path d="M 42 44 Q 42 32 52 28 Q 56 26 64 26 Q 72 26 76 28" 
          style="fill:none;stroke:#ffffff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round"/>
    
    <!-- Handle right -->
    <path d="M 76 28 Q 86 32 86 44" 
          style="fill:none;stroke:#ffffff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round"/>
    
    <!-- Download arrow -->
    <g transform="translate(64, 68)">
      <!-- Arrow shaft -->
      <rect x="-3" y="-16" width="6" height="20" rx="2" style="fill:#ffffff"/>
      <!-- Arrow head -->
      <path d="M -10 4 L 0 16 L 10 4 Z" style="fill:#ffffff"/>
    </g>
  </g>
  
  <!-- Decorative elements - small circles representing apps -->
  <circle cx="46" cy="56" r="2.5" style="fill:#ffffff;opacity:0.6"/>
  <circle cx="82" cy="56" r="2.5" style="fill:#ffffff;opacity:0.6"/>
  <circle cx="64" cy="92" r="2.5" style="fill:#ffffff;opacity:0.6"/>
</svg>
