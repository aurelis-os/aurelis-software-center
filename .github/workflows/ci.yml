name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          sudo apt-get install -y libegl1 libxkbcommon0 libxcb-cursor0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxcb-randr0 libxcb-image0 libxcb-keysyms1 libxcb-icccm4 libxcb-glx0 python3-pyqt6 python3-pyqt6.qtdbus
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Run ./check
        run: ./check
        env:
          QT_QPA_PLATFORM: offscreen
